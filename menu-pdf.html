<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta Oficial PDF | Restobar Alex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --gold: #f4c025;
    --bg-dark: #0a0a0a;
    --card-bg: #121212;
    --text-main: #ffffff;
    --text-muted: #aaaaaa;
}

@page {
    size: A4 portrait;
    margin: 10mm 12mm;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Outfit', sans-serif;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    font-size: 9.5px;
    line-height: 1.25;
}

/* ===== HEADER ===== */
.pdf-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 8px;
    margin-bottom: 10px;
}
.header-logo {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    object-fit: cover;
}
.header-info { text-align: right; }
.header-info h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem; color: var(--gold);
    letter-spacing: 2px; line-height: 0.9;
}
.header-info p { color: var(--text-muted); font-size: 0.8rem; margin-top: 2px; }
.header-info span { color: var(--gold); font-weight: 700; }

/* ===== PAGINA - layout de 2 columnas con grid ===== */
.page {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 10px;
    align-items: start;
}

.page-break {
    page-break-before: always;
    break-before: page;
    padding-top: 10px;
}

/* ===== CARD ===== */
.card {
    background-color: var(--card-bg);
    border: 1px solid rgba(244,192,37,0.15);
    border-top: 3px solid var(--gold);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
    break-inside: avoid;
    page-break-inside: avoid;
}

.card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem; color: var(--gold);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 3px; margin-bottom: 6px;
    letter-spacing: 1px;
    display: flex; align-items: center; gap: 6px;
}
.card-subtitle {
    font-size: 8px; color: var(--text-muted);
    margin-bottom: 5px; font-style: italic;
}

/* ===== ITEM ===== */
.item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 2.5px 0;
    border-bottom: 1px dotted rgba(255,255,255,0.07);
    gap: 4px;
}
.item:last-child { border-bottom: none; }

.item-left { flex: 1; min-width: 0; }
.item-name {
    font-weight: 600; font-size: 9px;
    color: var(--text-main);
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
}
.item-desc {
    font-size: 7.5px; color: var(--text-muted);
    margin-top: 1px; line-height: 1.2;
}
.item-price {
    font-weight: 700; color: var(--gold);
    font-size: 9.5px; white-space: nowrap;
    flex-shrink: 0;
}
.badge {
    background: var(--gold); color: #000;
    font-size: 6.5px; font-weight: 800;
    padding: 1px 4px; border-radius: 3px;
    white-space: nowrap;
}

/* ===== FOOTER ===== */
.pdf-footer {
    text-align: center;
    margin-top: 10px;
    padding-top: 6px;
    border-top: 1px solid rgba(244,192,37,0.3);
    color: var(--text-muted);
    font-size: 8px;
}
.pdf-footer a { color: var(--gold); text-decoration: none; font-weight: 700; }
</style>
</head>
<body>

<div class="pdf-header">
    <img src="images/logo.png" alt="Restobar Alex" class="header-logo" onerror="this.style.display='none'">
    <div class="header-info">
        <h1>Restobar Alex</h1>
        <p>Calle Feliu y Codina 47, Cornellà de Llobregat</p>
        <p>Pedidos &amp; Reservas: <span>697 89 88 55</span></p>
    </div>
</div>

<div id="page1" class="page"></div>
<div id="page2" class="page page-break"></div>

<div class="pdf-footer">
    Carta oficial de <a href="#">Restobar Alex</a>. Precios con IVA incluido. Escanea el código QR de nuestras mesas para ver imágenes y alérgenos.
</div>

<script src="menu-data.js"></script>
<script>
(function() {
    // Categorías que van en página 1 (columna izq, col der)
    const page1Left = ['tapasFrias', 'tapasCalientes'];
    const page1Right = ['bocadillosFrios', 'bocadillosCalientes', 'ensaladas'];
    // Categorías que van en página 2
    const page2Left = ['hamburguesas', 'novedades'];
    const page2Right = ['platosCombinados', 'carnes'];

    function renderCategory(catKey) {
        const catObj = MENU_DATA[catKey];
        if (!catObj || !catObj.items) return '';
        const items = catObj.items;
        const icon = catObj.icon || 'fa-utensils';
        const title = catObj.title || catKey;
        const subtitle = catObj.subtitle || '';

        let html = '<div class="card">';
        html += '<div class="card-title"><i class="fas ' + icon + '"></i> ' + title.toUpperCase() + '</div>';
        if (subtitle) html += '<div class="card-subtitle">' + subtitle + '</div>';

        items.forEach(item => {
            const badge = item.badge ? '<span class="badge">' + item.badge + '</span>' : '';
            const desc = (item.description || item.desc) || '';
            const price = typeof item.price === 'number' ? item.price.toFixed(2) + '\u20ac' : (item.price || 'Consultar');
            html += '<div class="item">';
            html += '<div class="item-left">';
            html += '<div class="item-name">' + item.name + badge + '</div>';
            if (desc) html += '<div class="item-desc">' + desc + '</div>';
            html += '</div>';
            html += '<div class="item-price">' + price + '</div>';
            html += '</div>';
        });
        html += '</div>';
        return html;
    }

    function buildColumn(keys) {
        return keys.map(k => renderCategory(k)).join('');
    }

    // Página 1
    const p1 = document.getElementById('page1');
    const col1L = document.createElement('div');
    col1L.innerHTML = buildColumn(page1Left);
    const col1R = document.createElement('div');
    col1R.innerHTML = buildColumn(page1Right);
    p1.appendChild(col1L);
    p1.appendChild(col1R);

    // Página 2
    const p2 = document.getElementById('page2');
    const col2L = document.createElement('div');
    col2L.innerHTML = buildColumn(page2Left);
    const col2R = document.createElement('div');
    col2R.innerHTML = buildColumn(page2Right);
    p2.appendChild(col2L);
    p2.appendChild(col2R);
})();
</script>
</body>
</html>
